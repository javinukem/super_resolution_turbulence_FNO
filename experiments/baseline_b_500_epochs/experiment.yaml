# Experiment config — consumed by src/training/experiment.py
# (transcribed from the original train script; see experiment_summary.md)

experiment: baseline_b_500_epochs
output:
  scratch_root: /export/scratch/jalegria/experiments
  folder_prefix: baseline_b_500_epochs_
  repo_dir: experiments/baseline_b_500_epochs
data:
  train_h5: /export/scratch/jalegria/full_states_h5/full_states.h5
  val_h5: /export/scratch/jalegria/full_states_h5/full_states_val.h5
  snapshot_index: 79
  upsample_factor: 4
  num_workers: 2
  eval_batch_size: 2
normalization:
  stats_path: experiments/l1_spectral_weighting/normalization_stats.npz
spectral_pool: 2
trilinear_baseline: false
training:
  epochs: 500
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 8
  grad_accum: 8
  noise_std: 0.01
  early_stop_patience: 40
  sched_factor: 0.5
  sched_patience: 15
  grad_clip_norm: null
  use_amp: false
runs:
- name: cfno_shift8_mse_spectral_w_minor_500e
  label: Baseline B (500 epochs)
  model_type: cfno
  model_params:
    in_channel: 5
    n_channels: 32
    n_residual_blocks: 3
    n_operator_blocks: 2
    modes: 16
    apply_constraint: false
    last_layer_kernel: 3
    shifting_modes: 8
  apply_positivity_relu: false
  use_norm: true
  eval_scales: &id001
  - 4
  - 2
  loss:
    type: mse_spectral
    spectral_weight: 0.0063649745225556375
    weight_name: w_minor
  manifest_extra:
    interpolation_mode: trilinear
    skip_connection: true
    skip_connection_interpolation_mode: trilinear
- name: cfno_shift8_mse_spectral_w_minor_500e_clip_p10
  label: Baseline B (500e, clip=1.0, p=10)
  model_type: cfno
  model_params:
    in_channel: 5
    n_channels: 32
    n_residual_blocks: 3
    n_operator_blocks: 2
    modes: 16
    apply_constraint: false
    last_layer_kernel: 3
    shifting_modes: 8
  apply_positivity_relu: false
  use_norm: true
  eval_scales: *id001
  loss:
    type: mse_spectral
    spectral_weight: 0.0063649745225556375
    weight_name: w_minor
  training:
    grad_clip_norm: 1.0
    sched_patience: 10
  manifest_extra:
    interpolation_mode: trilinear
    skip_connection: true
    skip_connection_interpolation_mode: trilinear
- name: cfno_shift8_mse_spectral_w_minor_500e_lr3e4_clip_p3
  label: Baseline B (500e, lr=3e-4, clip=1.0, p=3)
  model_type: cfno
  model_params:
    in_channel: 5
    n_channels: 32
    n_residual_blocks: 3
    n_operator_blocks: 2
    modes: 16
    apply_constraint: false
    last_layer_kernel: 3
    shifting_modes: 8
  apply_positivity_relu: false
  use_norm: true
  eval_scales: *id001
  loss:
    type: mse_spectral
    spectral_weight: 0.0063649745225556375
    weight_name: w_minor
  training:
    learning_rate: 0.0003
    grad_clip_norm: 1.0
    sched_patience: 3
  manifest_extra:
    interpolation_mode: trilinear
    skip_connection: true
    skip_connection_interpolation_mode: trilinear
