experiment: sfno_mse
output:
  scratch_root: null  # -> $TURBULENCE_SR_SCRATCH (src/utils/paths.py)
  folder_prefix: comparing_best_models_mse_
  repo_dir: experiments/sfno_mse
data:
  train_h5: null  # -> $TURBULENCE_SR_DATA/full_states.h5
  val_h5: null  # -> $TURBULENCE_SR_DATA/full_states_val.h5
  snapshot_index: 79
  upsample_factor: 4
  num_workers: 2
  eval_batch_size: 2
normalization:
  stats_path: experiments/normalization_stats.npz
spectral_pool: 2
trilinear_baseline: false
training:
  epochs: 500
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 8
  grad_accum: 8
  noise_std: 0.01
  early_stop_patience: 40
  sched_factor: 0.8
  sched_patience: 30
  grad_clip_norm: 0.8
  use_amp: false
runs:
- name: sfno
  label: SFNO shift=8, MSE only (500e, clip=1.0, p=10)
  model_type: sfno
  model_params:
    in_channel: 5
    n_channels: 32
    n_residual_blocks: 3
    n_operator_blocks: 2
    modes: 16
    apply_constraint: false
    last_layer_kernel: 3
    shifting_modes: 8
  apply_positivity_relu: false
  use_norm: true
  eval_scales:
  - 4
  - 2
  loss:
    type: mse
  manifest_extra:
    interpolation_mode: trilinear
    skip_connection: true
    skip_connection_interpolation_mode: trilinear
