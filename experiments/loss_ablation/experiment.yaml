# Experiment config — consumed by src/training/experiment.py
# (transcribed from the original train script; see experiment_summary.md)

experiment: loss_ablation
output:
  scratch_root: /export/scratch/jalegria/experiments
  folder_prefix: loss_ablation_
  repo_dir: experiments/loss_ablation
data:
  train_h5: /export/scratch/jalegria/full_states_h5/full_states.h5
  val_h5: /export/scratch/jalegria/full_states_h5/full_states_val.h5
  snapshot_index: 79
  upsample_factor: 4
  num_workers: 2
  eval_batch_size: 2
normalization:
  stats_path: experiments/l1_spectral_weighting/normalization_stats.npz
spectral_pool: 2
trilinear_baseline: false
training:
  epochs: 250
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 8
  grad_accum: 8
  noise_std: 0.01
  early_stop_patience: 40
  sched_factor: 0.5
  sched_patience: 15
  grad_clip_norm: null
  use_amp: false
runs:
- name: cfno_shift8_l1_only
  label: L1 only
  model_type: cfno
  model_params:
    in_channel: 5
    n_channels: 32
    n_residual_blocks: 3
    n_operator_blocks: 2
    modes: 16
    apply_constraint: false
    last_layer_kernel: 3
    shifting_modes: 8
  apply_positivity_relu: false
  use_norm: true
  eval_scales: &id001
  - 4
  - 2
  loss:
    type: l1
  manifest_extra:
    interpolation_mode: trilinear
    skip_connection: true
    skip_connection_interpolation_mode: trilinear
- name: cfno_shift8_mse_only
  label: MSE only
  model_type: cfno
  model_params:
    in_channel: 5
    n_channels: 32
    n_residual_blocks: 3
    n_operator_blocks: 2
    modes: 16
    apply_constraint: false
    last_layer_kernel: 3
    shifting_modes: 8
  apply_positivity_relu: false
  use_norm: true
  eval_scales: *id001
  loss:
    type: mse
  manifest_extra:
    interpolation_mode: trilinear
    skip_connection: true
    skip_connection_interpolation_mode: trilinear
- name: cfno_shift8_spectral_only
  label: Spectral only
  model_type: cfno
  model_params:
    in_channel: 5
    n_channels: 32
    n_residual_blocks: 3
    n_operator_blocks: 2
    modes: 16
    apply_constraint: false
    last_layer_kernel: 3
    shifting_modes: 8
  apply_positivity_relu: false
  use_norm: true
  eval_scales: *id001
  loss:
    type: spectral
  manifest_extra:
    interpolation_mode: trilinear
    skip_connection: true
    skip_connection_interpolation_mode: trilinear
