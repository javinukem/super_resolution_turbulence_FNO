experiment: edsr_mse
output:
  scratch_root: null  # -> $TURBULENCE_SR_SCRATCH (src/utils/paths.py)
  folder_prefix: edsr_norm_skip_
  repo_dir: experiments/edsr_mse
data:
  train_h5: null  # -> $TURBULENCE_SR_DATA/full_states.h5
  val_h5: null  # -> $TURBULENCE_SR_DATA/full_states_val.h5
  snapshot_index: 79
  upsample_factor: 4
  num_workers: 2
  eval_batch_size: 2
normalization:
  stats_path: experiments/normalization_stats.npz
spectral_pool: 2
trilinear_baseline: false
training:
  epochs: 250
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 8
  grad_accum: 8
  noise_std: 0.01
  early_stop_patience: 40
  sched_factor: 0.5
  sched_patience: 3
  grad_clip_norm: 1.0
  use_amp: false
runs:
- name: edsr_norm_skip_off
  label: EDSR norm (skip off)
  model_type: edsr
  model_params:
    input_channels: 5
    n_resblocks: 16
    n_feats: 64
    kernel_size: 3
    scale: 4
    activation_f: prelu
    skip_connection: false
    skip_connection_interpolation_mode: trilinear
  apply_positivity_relu: false
  use_norm: true
  eval_scales:
  - 4
  loss:
    type: mse
  manifest_extra:
    skip_connection: false
- name: edsr
  label: EDSR norm (skip on)
  model_type: edsr
  model_params:
    input_channels: 5
    n_resblocks: 16
    n_feats: 64
    kernel_size: 3
    scale: 4
    activation_f: prelu
    skip_connection: true
    skip_connection_interpolation_mode: trilinear
  apply_positivity_relu: false
  use_norm: true
  eval_scales:
  - 4
  loss:
    type: mse
  manifest_extra:
    skip_connection: true
