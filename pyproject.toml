[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turbulence"
version = "0.1"
description = "Super-resolution models for turbulence"
authors = [{ name = "javinukem"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["hydra-core>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend-select = ["E", "F", "C", "B", "Q"]
# Globally ignore "module level import not at top of file"
ignore = ["E402"]
