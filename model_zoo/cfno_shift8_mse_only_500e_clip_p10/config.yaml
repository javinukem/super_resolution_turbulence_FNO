name: cfno_shift8_mse_only_500e_clip_p10
label: CFNO shift=8, MSE only (500e, clip=1.0, p=10)
source_experiment: experiments/comparing_best_models_mse
weights:
  huggingface_repo: javinukem/turbulence_sr
  filename: cfno_shift8_mse_only_500e_clip_p10/weights.pt
  download: python scripts/download_weights.py
model:
  module: src.model.models_fno_2
  class_name: FNO_2
  params:
    in_channel: 5
    n_channels: 32
    n_residual_blocks: 3
    n_operator_blocks: 2
    modes: 16
    apply_constraint: false
    last_layer_kernel: 3
    shifting_modes: 8
    interpolation_mode: trilinear
    skip_connection: true
    skip_connection_interpolation_mode: trilinear
apply_positivity_relu: false
normalization:
  enabled: true
  stats_path: model_zoo/normalization_stats.npz
training:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 500
  batch_size: 8
  grad_accum: 8
  effective_batch_size: 64
  early_stop_patience: 40
  grad_clip_norm: 0.8
  scheduler:
    type: ReduceLROnPlateau
    factor: 0.8
    patience: 30
  noise_std: 0.01
  use_amp: false
  snapshot_index: 79
loss:
  type: mse
results:
  best_val_loss: 0.03410063999203535
  final_train_loss: 0.03329993642866611
  final_val_loss: 0.03444756223605229
