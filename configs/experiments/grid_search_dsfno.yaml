hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false

runtime:
  autocvd:
    enabled: false
    num_gpus: 1

data:
  kind: 3d
  kwargs:
    max_samples: 5000
  train_split: 0.8
  loaders:
    train_num_workers: 1
    test_num_workers: 1
    pin_memory: true
    persistent_workers: true

model:
  module: src.model.models_dsfno_3d
  class_name: DSFNO
  params:
    in_channel: 4
    apply_constraint: true

grid:
  modes: [4, 16, 32]
  n_channels: [8, 16, 32]
  n_residual_blocks: [2, 6, 8]
  n_operator_blocks: [2, 4, 6]

training:
  learning_rate: 0.0002
  batch_size: 4
  epochs: 100
  use_amp: false
  use_float16: false
  use_early_stopping: false
  early_stopping_patience: 8
  early_stopping_delta: 0.0
  upsample_factor: 4

output:
  root_dir: runs/dsfno_grid
