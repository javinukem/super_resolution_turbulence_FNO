hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false

runtime:
  autocvd:
    enabled: true
    num_gpus: 1
  timestamp_format: "%Y-%m-%d_%H-%M-%S"
  date_format: "%Y-%m-%d"
  output:
    enabled: true
    root_dir: experiments/cfno_2/experiment_6/runs
    run_dir_template: "{timestamp}_{model_tag}"
    weights_name_template: "fno_weights.pt"
    loss_curve_name_template: "loss_curve.png"
    config_name: "config.yaml"
    save_config: true
    save_weights: true
    save_loss_curve: true

data:
  kind: 3d
  kwargs:
    max_samples: 2500
  train_split: 0.8
  loaders:
    train_num_workers: 1
    test_num_workers: 1
    pin_memory: true
    persistent_workers: true

model:
  name: fno_2_exp4
  module: experiments.cfno_2.experiment_4.fno_2_exp_2
  class_name: FNO_2
  params:
    in_channel: 5
    n_channels: 32
    n_residual_blocks: 2
    n_operator_blocks: 2
    modes: 16
    shifting_modes: 3
    last_layer_kernel: 3
    last_layer_constraint: relu
  tag_template: "m{modes}_nc{n_channels}_res{n_residual_blocks}_op{n_operator_blocks}"

training:
  learning_rate: 0.0002
  batch_size: 4
  epochs: 85
  use_amp: true
  use_early_stopping: true
  early_stopping_patience: 8
  early_stopping_delta: 0.0
  upsample_factor: 4
